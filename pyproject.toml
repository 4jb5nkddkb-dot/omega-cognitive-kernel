[project]
name = "omega-cognitive-kernel"
dynamic = ["version"]
description = "Python bindings for omega-cognitive-kernel"
readme = "bindings/python/README.md"
license = {text = "MIT"}
authors = [{name = "Omega Core Contributors"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
keywords = ["cognitive", "agent", "runtime", "patch", "adaptive", "ai"]

[tool.maturin]
manifest-path = "bindings/python/Cargo.toml"
module-name = "omega_cognitive_kernel_python"
features = ["pyo3/extension-module"]
compatibility = "manylinux2014"

[tool.pytest.ini_options]
testpaths = ["test_python_bindings.py"]
addopts = "--strict-config --strict-markers"

[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"
