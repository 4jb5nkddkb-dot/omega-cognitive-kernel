# Example omega.toml — copy and adjust paths for your machine.

# state_path = "./my-agent-state.json"
autosave = true
auto_checkpoint_on_patch = true

# L1 patch sensitivity
error_threshold = 0.30
min_steps_between_patches = 3

# Decision constraint
max_risk = 0.65

# default_goal = "maintain coherent self-model while acting in world"

# Local UCB anti-oscillation and consequence accounting. Set min_dwell_steps=0,
# switch_margin=0, rollback_penalty=0, and switch_cost=0 for legacy behavior.
[bandit]
min_dwell_steps = 3
switch_margin = 0.05
rollback_penalty = 0.35
switch_cost = 0.02
