name: Security Audit

on:
  push:
    branches: [main, fix/security-audit-dependencies]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  security-audit:
    name: Cargo Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Run RustSec security audit
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
  update-cargo-lock:
    name: Update Python Cargo.lock
    if: github.event_name == 'push' && github.ref == 'refs/heads/fix/security-audit-dependencies'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo update --manifest-path bindings/python/Cargo.toml
      - run: |
          if [ -n "$(git status --porcelain bindings/python/Cargo.lock)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add bindings/python/Cargo.lock
            git commit -m "chore(python): update bindings/python/Cargo.lock"
            git push origin HEAD:fix/security-audit-dependencies
          fi
