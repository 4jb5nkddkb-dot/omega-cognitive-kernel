name: Docs Links

on:
  pull_request:
    paths:
      - "**/*.md"
      - ".github/workflows/docs-links.yml"
  push:
    branches:
      - main
    paths:
      - "**/*.md"
      - ".github/workflows/docs-links.yml"

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check internal Markdown links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --verbose --no-progress --offline README.md ARCHITECTURE.md CHANGELOG.md RELEASING.md ROADMAP.md "docs/**/*.md" examples/README.md bindings/python/README.md
