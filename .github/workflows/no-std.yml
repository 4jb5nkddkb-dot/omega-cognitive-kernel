name: no_std portability

on:
  push:
    branches: [main, 'L2-improvement']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  NO_STD_TARGET: thumbv7em-none-eabihf

jobs:
  embedded-probe:
    name: no_std probe and kernel core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain and embedded target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Compile pure no_std probe
        run: ./scripts/test-no-std.sh

  core-no-std:
    name: Full kernel core no_std check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain and embedded target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Compile kernel core
        run: ./scripts/test-no-std.sh
        env:
          NO_STD_LOG: no-std-kernel.log

      - name: Upload no_std blocker log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: no-std-kernel-report
          path: no-std-kernel.log
          if-no-files-found: ignore
