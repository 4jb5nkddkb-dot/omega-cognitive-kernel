name: Archive Release Notes
on:
  push:
    branches:
      - docs/archive-release-notes
permissions:
  contents: write
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move release notes and clean up workflow
        run: |
          mkdir -p docs/releases
          git mv RELEASE_NOTES_v*.md docs/releases/
          if grep -q '`RELEASE_NOTES_v\*.md`' README.md; then
            sed -i 's|`RELEASE_NOTES_v\*.md`|`docs/releases/RELEASE_NOTES_v*.md`|g' README.md
            git add README.md
          fi
          git rm .github/workflows/archive-release-notes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: archive historical RELEASE_NOTES_v*.md into docs/releases/"
          git push
