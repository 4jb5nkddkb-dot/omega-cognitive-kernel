name: Release to PyPI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  # -------------------------------------------------------------------------
  # Stage 1: build every artifact (Linux, Windows, macOS wheels + sdist).
  # -------------------------------------------------------------------------
  build-linux:
    name: Build Linux wheels (Python 3.10-3.13)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build Linux wheel (manylinux2014 via docker)
        env:
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
        run: |
          docker run --rm \
            -v "${{ github.workspace }}":/io \
            -w /io/bindings/python \
            ghcr.io/pyo3/maturin:latest \
            build --release --locked --interpreter python --compatibility manylinux2014 --out wheelhouse
      - name: Upload Linux wheel
        uses: actions/upload-artifact@v7
        with:
          name: wheels-linux-${{ matrix.python-version }}
          path: bindings/python/wheelhouse/*.whl
          retention-days: 1

  build-windows:
    name: Build Windows wheels (Python 3.10-3.13)
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install maturin
        run: python -m pip install maturin
      - name: Build Windows wheel
        working-directory: bindings/python
        env:
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
        run: |
          maturin build --release --locked --interpreter python --out wheelhouse
      - name: Upload Windows wheel
        uses: actions/upload-artifact@v7
        with:
          name: wheels-windows-${{ matrix.python-version }}
          path: bindings/python/wheelhouse/*.whl
          retention-days: 1

  build-macos:
    name: Build macOS wheels (Python 3.10-3.13)
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install maturin
        run: python -m pip install maturin
      - name: Build macOS wheel (universal2)
        working-directory: bindings/python
        env:
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
        run: |
          maturin build --release --locked --interpreter python --universal2 --out wheelhouse
      - name: Upload macOS wheel
        uses: actions/upload-artifact@v7
        with:
          name: wheels-macos-${{ matrix.python-version }}
          path: bindings/python/wheelhouse/*.whl
          retention-days: 1

  build-sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install maturin
        run: python -m pip install maturin
      - name: Build sdist
        working-directory: bindings/python
        run: maturin sdist --out wheelhouse
      - name: Upload sdist
        uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: bindings/python/wheelhouse/*.tar.gz
          retention-days: 1

  # -------------------------------------------------------------------------
  # Stage 2: install and test every built wheel on its native platform/version.
  # Publication is gated on this so a broken wheel never reaches PyPI.
  # -------------------------------------------------------------------------
  test-wheels:
    name: Test wheel (${{ matrix.os }} / ${{ matrix.python-version }})
    needs: [build-linux, build-windows, build-macos]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test tooling
        run: python -m pip install pytest
      - name: Resolve artifact name
        id: art
        shell: bash
        run: |
          case "${{ matrix.os }}" in
            ubuntu-latest)  plat=linux ;;
            windows-latest) plat=windows ;;
            macos-latest)   plat=macos ;;
          esac
          echo "name=wheels-${plat}-${{ matrix.python-version }}" >> "$GITHUB_OUTPUT"
      - name: Download built wheel
        uses: actions/download-artifact@v8
        with:
          name: ${{ steps.art.outputs.name }}
          path: wheelhouse
      - name: Install the wheel
        shell: bash
        run: python -m pip install wheelhouse/omega_cognitive_kernel-*.whl
      - name: Test the installed extension
        run: python -m pytest

  # -------------------------------------------------------------------------
  # Stage 3: publish only after every wheel has passed its install-and-test
  # gate. Uses Trusted Publishing (OIDC); no stored API token.
  # -------------------------------------------------------------------------
  publish:
    name: Publish to PyPI
    needs: [test-wheels, build-sdist]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: wheels-*
          merge-multiple: true
      - name: Download sdist
        uses: actions/download-artifact@v8
        with:
          name: sdist
          path: dist
      - name: Show all artifacts
        run: ls -la dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
