name: Release to PyPI

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write
  contents: read

jobs:
  build-linux:
    name: Build Linux wheels (Python 3.10-3.13)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build Linux wheels
        uses: pypa/cibuildwheel@v2.16.0
        with:
          package-dir: bindings/python
          output-dir: wheelhouse
          python-version: '3.10 - 3.13'
        env:
          CIBW_BUILD: cp310 cp311 cp312 cp313
          CIBW_SKIP: "pp* cp38 cp39"
          CIBW_BUILD_ISOLATION: "false"
          CIBW_BEFORE_BUILD: "pip install maturin"
          CIBW_ENVIRONMENT: "PYO3_USE_ABI3_FORWARD_COMPATIBILITY=1"
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"

      - name: Upload Linux wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux
          path: bindings/python/wheelhouse/*.whl
          retention-days: 1

  build-windows:
    name: Build Windows wheels (Python 3.10-3.13)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build Windows wheels
        uses: pypa/cibuildwheel@v2.16.0
        with:
          package-dir: bindings/python
          output-dir: wheelhouse
          python-version: '3.10 - 3.13'
        env:
          CIBW_BUILD: cp310 cp311 cp312 cp313
          CIBW_SKIP: "pp* cp38 cp39"
          CIBW_BUILD_ISOLATION: "false"
          CIBW_BEFORE_BUILD: "pip install maturin"
          CIBW_ENVIRONMENT: "PYO3_USE_ABI3_FORWARD_COMPATIBILITY=1"
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"

      - name: Upload Windows wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-windows
          path: bindings/python/wheelhouse/*.whl
          retention-days: 1

  publish:
    name: Publish to PyPI
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download all wheels
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: wheels-*
          merge-multiple: true

      - name: Show all wheels
        run: ls -la dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/