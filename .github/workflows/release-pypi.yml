name: Release to PyPI

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write
  contents: read

jobs:
  build-wheels:
    name: Build wheel (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.8', '3.9', '3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: x86_64-unknown-linux-gnu
          args: --release --out dist
          manylinux: '2_28'
          python-version: ${{ matrix.python }}
          working-directory: bindings/python

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-py${{ matrix.python }}
          path: bindings/python/dist/*.whl
          retention-days: 1

  collect-wheels:
    name: Collect all wheels
    needs: build-wheels
    runs-on: ubuntu-latest
    steps:
      - name: Download wheel (Python 3.8)
        uses: actions/download-artifact@v4
        with:
          name: wheel-py3.8
          path: dist
      - name: Download wheel (Python 3.9)
        uses: actions/download-artifact@v4
        with:
          name: wheel-py3.9
          path: dist
      - name: Download wheel (Python 3.10)
        uses: actions/download-artifact@v4
        with:
          name: wheel-py3.10
          path: dist
      - name: Download wheel (Python 3.11)
        uses: actions/download-artifact@v4
        with:
          name: wheel-py3.11
          path: dist
      - name: Download wheel (Python 3.12)
        uses: actions/download-artifact@v4
        with:
          name: wheel-py3.12
          path: dist
      - name: Download wheel (Python 3.13)
        uses: actions/download-artifact@v4
        with:
          name: wheel-py3.13
          path: dist

      - name: Show collected wheels
        run: ls -la dist/

      - name: Upload merged wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels
          path: dist/*.whl
          retention-days: 1

  publish:
    name: Publish to PyPI
    needs: collect-wheels
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download all wheels
        uses: actions/download-artifact@v4
        with:
          name: wheels
          path: dist
          merge-multiple: true

      - name: Show wheels
        run: ls -la dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/