name: Release to PyPI

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write
  contents: read

jobs:
  build-linux:
    name: Build Linux wheels (Python 3.10-3.13)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Set up Python 3.10 (for cibuildwheel)
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install cibuildwheel
        run: pip install cibuildwheel

      - name: Verify Docker
        run: |
          docker version
          docker pull quay.io/pypa/manylinux_2_28_x86_64:2025.04.19-1

      - name: Build Linux wheels
        working-directory: bindings/python
        env:
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
          CIBW_BUILD: cp310 cp311 cp312 cp313
          CIBW_SKIP: "pp* cp38 cp39"
          CIBW_BUILD_ISOLATION: "false"
          CIBW_BEFORE_BUILD: "pip install maturin"
          CIBW_ENVIRONMENT: "PYO3_USE_ABI3_FORWARD_COMPATIBILITY=1"
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
        run: |
          python -m cibuildwheel --platform linux --output-dir wheelhouse .

      - name: Upload Linux wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux
          path: bindings/python/wheelhouse/*.whl
          retention-days: 1

  build-windows:
    name: Build Windows wheels (Python 3.10-3.13)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Verify Python installations
        run: |
          py -3.10 -c "import sys; print(sys.version)"
          py -3.11 -c "import sys; print(sys.version)"
          py -3.12 -c "import sys; print(sys.version)"
          py -3.13 -c "import sys; print(sys.version)"

      - name: Install cibuildwheel (for Python 3.10)
        run: py -3.10 -m pip install cibuildwheel

      - name: Build Windows wheels
        working-directory: bindings/python
        env:
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
          CIBW_BUILD: cp310 cp311 cp312 cp313
          CIBW_SKIP: "pp* cp38 cp39"
          CIBW_BUILD_ISOLATION: "false"
          CIBW_BEFORE_BUILD: "pip install maturin"
          CIBW_ENVIRONMENT: "PYO3_USE_ABI3_FORWARD_COMPATIBILITY=1"
        run: |
          py -3.10 -m cibuildwheel --platform windows --output-dir wheelhouse .

      - name: Upload Windows wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-windows
          path: bindings/python/wheelhouse/*.whl
          retention-days: 1

  publish:
    name: Publish to PyPI
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download all wheels
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: wheels-*
          merge-multiple: true

      - name: Show all wheels
        run: ls -la dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/