name: Release to PyPI

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write
  contents: read

jobs:
  build-wheels:
    name: Build all wheels
    runs-on: ubuntu-latest
    container:
      image: quay.io/pypa/manylinux_2_28_x86_64
      options: --user root
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Python versions
        run: |
          dnf install -y python3.8 python3.8-devel python3.9 python3.9-devel python3.10 python3.10-devel python3.11 python3.11-devel python3.12 python3.12-devel python3.13 python3.13-devel
          # Python 3.14 not in AlmaLinux 8 repos, skip for now
          alternatives --install /usr/bin/python3 python3 /usr/bin/python3.12 1
          alternatives --install /usr/bin/pip3 pip3 /usr/bin/pip3.12 1

      - name: Install maturin
        run: pip3 install maturin

      - name: Build all wheels
        working-directory: bindings/python
        env:
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
        run: |
          for py in python3.8 python3.9 python3.10 python3.11 python3.12 python3.13; do
            echo "Building for $py..."
            $py -m pip install maturin
            $py -m maturin build --release --out dist --interpreter $py
          done

      - name: Upload all wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels
          path: bindings/python/dist/*.whl
          retention-days: 1

  publish:
    name: Publish to PyPI
    needs: build-wheels
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download all wheels
        uses: actions/download-artifact@v4
        with:
          name: wheels
          path: dist
          merge-multiple: true

      - name: Show wheels
        run: ls -la dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/