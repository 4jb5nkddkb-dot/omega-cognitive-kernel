name: Release to PyPI

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write
  contents: read

jobs:
  build-wheels:
    name: Build wheel (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.8', '3.9', '3.10', '3.11', '3.12', '3.13']
    container:
      image: quay.io/pypa/manylinux_2_28_x86_64
      options: --user root
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Python ${{ matrix.python }}
        run: |
          dnf install -y python${{ matrix.python }} python${{ matrix.python }}-devel
          alternatives --install /usr/bin/python3 python3 /usr/bin/python${{ matrix.python }} 1
          alternatives --install /usr/bin/pip3 pip3 /usr/bin/pip${{ matrix.python }} 1

      - name: Install maturin
        run: pip3 install maturin

      - name: Build wheel
        working-directory: bindings/python
        env:
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
        run: |
          python -m maturin build --release --out dist --interpreter python

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-py${{ matrix.python }}
          path: bindings/python/dist/*.whl
          retention-days: 1

  publish:
    name: Publish to PyPI
    needs: build-wheels
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download wheel (Python 3.8)
        uses: actions/download-artifact@v4
        with:
          name: wheel-py3.8
          path: dist
      - name: Download wheel (Python 3.9)
        uses: actions/download-artifact@v4
        with:
          name: wheel-py3.9
          path: dist
      - name: Download wheel (Python 3.10)
        uses: actions/download-artifact@v4
        with:
          name: wheel-py3.10
          path: dist
      - name: Download wheel (Python 3.11)
        uses: actions/download-artifact@v4
        with:
          name: wheel-py3.11
          path: dist
      - name: Download wheel (Python 3.12)
        uses: actions/download-artifact@v4
        with:
          name: wheel-py3.12
          path: dist
      - name: Download wheel (Python 3.13)
        uses: actions/download-artifact@v4
        with:
          name: wheel-py3.13
          path: dist

      - name: Show wheels
        run: ls -la dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/