name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    name: Build Linux binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --release

      - name: Build release binary
        run: cargo build --release --bin omega-kernel

      - name: Package artifact
        run: |
          mkdir -p dist
          cp target/release/omega-kernel dist/omega-kernel-linux-x86_64
          cp LICENSE README.md CHANGELOG.md ARCHITECTURE.md dist/
          tar -czf omega-kernel-linux-x86_64.tar.gz -C dist .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: omega-kernel-linux-x86_64
          path: omega-kernel-linux-x86_64.tar.gz

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: omega-kernel-linux-x86_64.tar.gz
          body: |
            ## Omega Cognitive Kernel ${{ github.ref_name }}

            Training-free online strategy-patch runtime (`RuleEffect`).
            Research prototype — not AGI; L2 fixed-point language is heuristic.

            ### Install
            ```bash
            cargo install --git https://github.com/4jb5nkddkb-dot/omega-cognitive-kernel --tag ${{ github.ref_name }} --locked
            ```

            ### Binary
            Attached: `omega-kernel-linux-x86_64.tar.gz` (includes LICENSE, README, CHANGELOG, ARCHITECTURE).

            ### Quick check
            ```bash
            omega-kernel demo
            omega-kernel task --episodes 4 --steps 3
            omega-kernel --help
            ```

            ### Notes for v0.3.7+
            - L2 meta-biases mapped into DecisionMaker
            - Strategy idle-decay metrics on bandit `task`
            - L0 Learner owns update + decay
            - See `RELEASE_NOTES_v0.3.7.md` / `CHANGELOG.md` on the tag

            ### Safety
            Whitelist executor · bounded RuleEffect · checkpoint/rollback · audit log · no arbitrary code exec
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
