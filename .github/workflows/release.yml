name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --release

      - name: Build release binary
        run: cargo build --release --bin omega-kernel

      - name: Package artifact
        run: |
          mkdir -p dist
          cp target/release/omega-kernel dist/omega-kernel-linux-x86_64
          cp LICENSE README.md CHANGELOG.md dist/
          tar -czf omega-kernel-linux-x86_64.tar.gz -C dist .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: omega-kernel-linux-x86_64
          path: omega-kernel-linux-x86_64.tar.gz

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: omega-kernel-linux-x86_64.tar.gz
          body: |
            ## Omega Kernel ${{ github.ref_name }}

            Training-free online strategy-patch runtime (`RuleEffect`).

            ### Install from source
            ```bash
            cargo install --git https://github.com/4jb5nkddkb-dot/omega-cognitive-kernel --tag ${{ github.ref_name }} --locked
            ```

            ### Binary
            See attached `omega-kernel-linux-x86_64.tar.gz`.

            ### Quick check
            ```bash
            omega-kernel demo
            omega-kernel --help
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
