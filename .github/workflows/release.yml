name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and attach binary to (e.g. v0.3.7)"
        required: true
        default: "v0.3.7"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    name: Build Linux binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # On tag push, GITHUB_REF is the tag; on dispatch, check out the requested tag
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --release

      - name: Build release binary
        run: cargo build --release --bin omega-kernel

      - name: Resolve tag name
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Package artifact
        run: |
          TAG="${{ steps.tag.outputs.name }}"
          mkdir -p dist
          cp target/release/omega-kernel dist/omega-kernel-linux-x86_64
          cp LICENSE README.md CHANGELOG.md ARCHITECTURE.md dist/ 2>/dev/null || true
          NOTES="RELEASE_NOTES_${TAG}.md"
          if [ -f "$NOTES" ]; then cp "$NOTES" dist/; fi
          tar -czf omega-kernel-linux-x86_64.tar.gz -C dist .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: omega-kernel-linux-x86_64
          path: omega-kernel-linux-x86_64.tar.gz

      - name: Load release notes body
        id: notes
        run: |
          TAG="${{ steps.tag.outputs.name }}"
          NOTES="RELEASE_NOTES_${TAG}.md"
          if [ -f "$NOTES" ]; then
            {
              echo "body<<OMEGA_RELEASE_EOF"
              cat "$NOTES"
              echo ""
              echo "OMEGA_RELEASE_EOF"
            } >> "$GITHUB_OUTPUT"
            echo "Using $NOTES as release body"
          else
            {
              echo "body<<OMEGA_RELEASE_EOF"
              echo "## Omega Cognitive Kernel ${TAG}"
              echo ""
              echo "Training-free online strategy-patch runtime (RuleEffect)."
              echo "See CHANGELOG.md on this tag for details."
              echo "OMEGA_RELEASE_EOF"
            } >> "$GITHUB_OUTPUT"
            echo "No $NOTES; using fallback body"
          fi

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          generate_release_notes: false
          files: omega-kernel-linux-x86_64.tar.gz
          body: ${{ steps.notes.outputs.body }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
