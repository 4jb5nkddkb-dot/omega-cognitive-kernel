name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    name: Build Linux binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --release

      - name: Build release binary
        run: cargo build --release --bin omega-kernel

      - name: Package artifact
        run: |
          mkdir -p dist
          cp target/release/omega-kernel dist/omega-kernel-linux-x86_64
          cp LICENSE README.md CHANGELOG.md ARCHITECTURE.md dist/
          NOTES="RELEASE_NOTES_${GITHUB_REF_NAME}.md"
          if [ -f "$NOTES" ]; then cp "$NOTES" dist/; fi
          tar -czf omega-kernel-linux-x86_64.tar.gz -C dist .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: omega-kernel-linux-x86_64
          path: omega-kernel-linux-x86_64.tar.gz

      - name: Load release notes body
        id: notes
        run: |
          NOTES="RELEASE_NOTES_${GITHUB_REF_NAME}.md"
          if [ -f "$NOTES" ]; then
            {
              echo "body<<OMEGA_RELEASE_EOF"
              cat "$NOTES"
              echo ""
              echo "OMEGA_RELEASE_EOF"
            } >> "$GITHUB_OUTPUT"
            echo "Using $NOTES as release body"
          else
            {
              echo "body<<OMEGA_RELEASE_EOF"
              echo "## Omega Cognitive Kernel ${GITHUB_REF_NAME}"
              echo ""
              echo "Training-free online strategy-patch runtime (RuleEffect)."
              echo "See CHANGELOG.md on this tag for details."
              echo ""
              echo "### Install"
              echo '```bash'
              echo "cargo install --git https://github.com/4jb5nkddkb-dot/omega-cognitive-kernel --tag ${GITHUB_REF_NAME} --locked"
              echo '```'
              echo "OMEGA_RELEASE_EOF"
            } >> "$GITHUB_OUTPUT"
            echo "No $NOTES; using fallback body"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: false
          files: omega-kernel-linux-x86_64.tar.gz
          body: ${{ steps.notes.outputs.body }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
