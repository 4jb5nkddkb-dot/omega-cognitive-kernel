name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create/update release for (e.g. v0.4.6)"
        required: true
        default: "v0.4.6"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps for egui
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libssl-dev libgl1-mesa-dev libx11-dev libxcursor-dev \
            libxrandr-dev libxi-dev libwayland-dev libxkbcommon-x11-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Test (CLI surface)
        run: cargo test --release

      - name: Build CLI binaries
        run: |
          cargo build --release --bin omega-kernel
          cargo build --release --bin omega-audit-panel

      - name: Build GUI dashboard
        continue-on-error: true
        run: cargo build --release --features gui --bin omega-dashboard

      - name: Package artifacts
        run: |
          mkdir -p dist
          [ -f target/release/omega-kernel ] && cp target/release/omega-kernel dist/omega-kernel-linux-x86_64
          [ -f target/release/omega-audit-panel ] && cp target/release/omega-audit-panel dist/omega-audit-panel-linux-x86_64
          [ -f target/release/omega-dashboard ] && cp target/release/omega-dashboard dist/omega-dashboard-linux-x86_64
          cp LICENSE README.md CHANGELOG.md ARCHITECTURE.md dist/ 2>/dev/null || true
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          NOTES="RELEASE_NOTES_${TAG}.md"
          [ -f "$NOTES" ] && cp "$NOTES" dist/ || true
          ls -la dist/
          tar -czf omega-kernel-linux-x86_64.tar.gz -C dist .

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: omega-linux
          path: omega-kernel-linux-x86_64.tar.gz

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build CLI binaries
        run: |
          cargo build --release --bin omega-kernel
          cargo build --release --bin omega-audit-panel

      - name: Build GUI dashboard
        continue-on-error: true
        run: cargo build --release --features gui --bin omega-dashboard

      - name: Package artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          if (Test-Path target/release/omega-kernel.exe) { Copy-Item target/release/omega-kernel.exe dist/omega-kernel-windows-x86_64.exe }
          if (Test-Path target/release/omega-audit-panel.exe) { Copy-Item target/release/omega-audit-panel.exe dist/omega-audit-panel-windows-x86_64.exe }
          if (Test-Path target/release/omega-dashboard.exe) { Copy-Item target/release/omega-dashboard.exe dist/omega-dashboard-windows-x86_64.exe }
          Get-ChildItem dist

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: omega-windows
          path: dist/*
          if-no-files-found: warn

  release:
    name: Publish GitHub Release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p out
          find artifacts -type f -exec cp {} out/ \;
          ls -la out/

      - name: Load release notes
        id: notes
        run: |
          TAG="${{ steps.tag.outputs.name }}"
          NOTES="RELEASE_NOTES_${TAG}.md"
          if [ -f "$NOTES" ]; then
            {
              echo "body<<OMEGA_RELEASE_EOF"
              cat "$NOTES"
              echo ""
              echo "OMEGA_RELEASE_EOF"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "body<<OMEGA_RELEASE_EOF"
              echo "## Omega Cognitive Kernel ${TAG}"
              echo ""
              echo "- **omega-kernel** — CLI runtime"
              echo "- **omega-audit-panel** — audit operator tool"
              echo "- **omega-dashboard** — desktop GUI (if build succeeded)"
              echo ""
              echo "See CHANGELOG.md for details."
              echo "OMEGA_RELEASE_EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: Omega Cognitive Kernel ${{ steps.tag.outputs.name }}
          generate_release_notes: false
          files: out/*
          body: ${{ steps.notes.outputs.body }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
