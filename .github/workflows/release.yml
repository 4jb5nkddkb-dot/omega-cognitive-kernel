name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create/update release for (e.g. v0.6.1)"
        required: true
        type: string
      dry_run:
        description: "Build and verify artifacts without publishing a GitHub release"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  validate-version:
    name: Validate package versions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_tag: ${{ steps.tag.outputs.name }}
      release_sha: ${{ steps.tag.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Resolve requested tag and source commit
        id: tag
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "Unsupported release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          git fetch --force origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          tag_sha="$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")"
          git checkout --detach "$tag_sha"
          checkout_sha="$(git rev-parse HEAD)"
          if [ "$checkout_sha" != "$tag_sha" ]; then
            echo "Checked-out source $checkout_sha does not match tag target $tag_sha" >&2
            exit 1
          fi
          echo "name=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$tag_sha" >> "$GITHUB_OUTPUT"
          echo "Release tag $RELEASE_TAG resolves to source commit $tag_sha"

      - name: Check package versions at the tag target
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.name }}
        run: python3 scripts/check-release-version.py "$RELEASE_TAG"

  build-linux:
    name: Build Linux
    needs: [validate-version]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.validate-version.outputs.release_sha }}

      - name: Verify release source commit
        env:
          EXPECTED_RELEASE_SHA: ${{ needs.validate-version.outputs.release_sha }}
        run: |
          actual_sha="$(git rev-parse HEAD)"
          echo "Release artifact source SHA: $actual_sha"
          test "$actual_sha" = "$EXPECTED_RELEASE_SHA"

      - name: Install system deps for egui
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libssl-dev libgl1-mesa-dev libx11-dev libxcursor-dev \
            libxrandr-dev libxi-dev libwayland-dev libxkbcommon-x11-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Test (CLI surface)
        run: cargo test --release --locked

      - name: Build CLI binaries
        run: |
          cargo build --release --locked --bin omega-kernel
          cargo build --release --locked --bin omega-audit-panel

      - name: Build GUI dashboard
        run: cargo build --release --features gui --bin omega-dashboard --locked

      - name: Package artifacts
        env:
          RELEASE_TAG: ${{ needs.validate-version.outputs.release_tag }}
        run: |
          mkdir -p dist
          cp target/release/omega-kernel dist/omega-kernel-linux-x86_64
          cp target/release/omega-audit-panel dist/omega-audit-panel-linux-x86_64
          cp target/release/omega-dashboard dist/omega-dashboard-linux-x86_64
          cp LICENSE README.md CHANGELOG.md ARCHITECTURE.md dist/ 2>/dev/null || true
          TAG="$RELEASE_TAG"
          NOTES="RELEASE_NOTES_${TAG}.md"
          [ -f "$NOTES" ] && cp "$NOTES" dist/ || true
          ls -la dist/
          tar -czf omega-kernel-linux-x86_64.tar.gz -C dist .

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v7
        with:
          name: omega-linux
          path: omega-kernel-linux-x86_64.tar.gz

  build-windows:
    name: Build Windows
    needs: [validate-version]
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.validate-version.outputs.release_sha }}

      - name: Verify release source commit
        env:
          EXPECTED_RELEASE_SHA: ${{ needs.validate-version.outputs.release_sha }}
        run: |
          $actualSha = git rev-parse HEAD
          Write-Host "Release artifact source SHA: $actualSha"
          if ($actualSha -ne $env:EXPECTED_RELEASE_SHA) {
            throw "Release source $actualSha does not match tag target $env:EXPECTED_RELEASE_SHA"
          }

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build CLI binaries
        run: |
          cargo build --release --bin omega-kernel --locked
          cargo build --release --bin omega-audit-panel --locked

      - name: Build GUI dashboard
        run: cargo build --release --features gui --bin omega-dashboard --locked

      - name: Package artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/omega-kernel.exe dist/omega-kernel-windows-x86_64.exe
          Copy-Item target/release/omega-audit-panel.exe dist/omega-audit-panel-windows-x86_64.exe
          Copy-Item target/release/omega-dashboard.exe dist/omega-dashboard-windows-x86_64.exe
          Get-ChildItem dist

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: omega-windows
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [validate-version, build-linux, build-windows]
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.validate-version.outputs.release_sha }}

      - name: Verify release source commit
        env:
          EXPECTED_RELEASE_SHA: ${{ needs.validate-version.outputs.release_sha }}
        run: |
          actual_sha="$(git rev-parse HEAD)"
          echo "Release notes source SHA: $actual_sha"
          test "$actual_sha" = "$EXPECTED_RELEASE_SHA"

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p out
          find artifacts -type f -exec cp {} out/ \;
          ls -la out/

      - name: Load release notes
        id: notes
        env:
          RELEASE_TAG: ${{ needs.validate-version.outputs.release_tag }}
        run: |
          TAG="$RELEASE_TAG"
          NOTES="RELEASE_NOTES_${TAG}.md"
          if [ -f "$NOTES" ]; then
            {
              echo "body<<OMEGA_RELEASE_EOF"
              cat "$NOTES"
              echo ""
              echo "OMEGA_RELEASE_EOF"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "body<<OMEGA_RELEASE_EOF"
              echo "## Omega Cognitive Kernel ${TAG}"
              echo ""
              echo "- **omega-kernel** — CLI runtime"
              echo "- **omega-audit-panel** — audit operator tool"
              echo "- **omega-dashboard** — desktop GUI"
              echo ""
              echo "See CHANGELOG.md for details."
              echo "OMEGA_RELEASE_EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate-version.outputs.release_tag }}
          name: Omega Cognitive Kernel ${{ needs.validate-version.outputs.release_tag }}
          generate_release_notes: false
          files: out/*
          body: ${{ steps.notes.outputs.body }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
