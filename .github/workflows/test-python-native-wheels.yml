name: Python Native Wheel Tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-native-wheels:
    name: ${{ matrix.os }} / CPython ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test tooling
        run: python -m pip install maturin pytest

      - name: Build Windows x86_64 wheel
        if: matrix.os == 'windows-latest'
        working-directory: bindings/python
        shell: bash
        env:
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
        run: >-
          maturin build --release --locked
          --interpreter "$(python -c 'import sys; print(sys.executable)')"
          --out wheelhouse

      - name: Build macOS universal2 wheel
        if: matrix.os == 'macos-latest'
        working-directory: bindings/python
        shell: bash
        env:
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
        run: >-
          maturin build --release --locked
          --interpreter "$(python -c 'import sys; print(sys.executable)')"
          --target universal2-apple-darwin --out wheelhouse

      - name: Verify wheel Python and ABI tags
        run: >-
          python scripts/check-python-wheel-tags.py
          --python-version "${{ matrix.python-version }}"
          bindings/python/wheelhouse

      - name: Install the wheel
        shell: bash
        run: python -m pip install bindings/python/wheelhouse/omega_cognitive_kernel-*.whl

      - name: Test the installed extension
        run: python -m pytest
