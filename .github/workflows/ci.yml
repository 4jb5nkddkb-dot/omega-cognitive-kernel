name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check
        continue-on-error: true

      # Print full output so agents can debug; still fail on hard errors.
      # Warnings allowed temporarily during productization phase-1.
      - name: Clippy
        run: cargo clippy --all-targets --message-format=short 2>&1

      - name: Run tests
        run: cargo test --verbose

      - name: Build release binary
        run: cargo build --release --bin omega-kernel
