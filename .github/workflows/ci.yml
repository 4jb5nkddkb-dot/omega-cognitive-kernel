name: CI

on:
  push:
    branches: [main, 'L2-improvement']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
   
env:
  CARGO_TERM_COLOR: always
  WASMTIME_VERSION: v50.0.1

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --locked --verbose
      - name: Run doc tests
        run: cargo test --doc --locked
        
      - name: Build release binary
        run: cargo build --locked --release --bin omega-kernel

  async:
    name: Async feature
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build with async feature
        run: cargo build --locked --features async

      - name: Test with async feature
        run: cargo test --locked --lib --features async --verbose

  python:
    name: Python bindings (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test tooling
        run: python -m pip install pytest
      # Build the same manylinux2014 wheel the release workflow publishes, then
      # install and test it on each supported CPython. This validates the release
      # artifact on every version instead of only 3.13.
      - name: Build manylinux wheel
        run: |
          mkdir -p /tmp/omega-wheelhouse
          docker run --rm \
            -v "${{ github.workspace }}":/io \
            -v /tmp/omega-wheelhouse:/wheelhouse \
            -w /io/bindings/python \
            ghcr.io/pyo3/maturin:latest \
            build --release --locked --interpreter python${{ matrix.python-version }} --compatibility manylinux2014 --out /wheelhouse
      - name: Verify wheel Python and ABI tags
        run: python scripts/check-python-wheel-tags.py --python-version "${{ matrix.python-version }}" /tmp/omega-wheelhouse
      - run: python -m pip install /tmp/omega-wheelhouse/omega_cognitive_kernel-*.whl
      - name: Test the installed extension
        run: python -m pytest

  python-binding-msrv:
    name: Python binding MSRV (Rust 1.83)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.83.0
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test Python binding at its declared MSRV
        run: cargo test --manifest-path bindings/python/Cargo.toml --locked

  gui:
    name: Dashboard GUI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Test Dashboard binary and fixed-point event parser
        run: cargo test --locked --features gui --bin omega-dashboard

      - name: Build GUI release binary
        run: cargo build --locked --release --features gui --bin omega-dashboard

  wasm:
    name: WASM portability
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain and WASM targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,wasm32-wasip1

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # Browser target (wasm32-unknown-unknown): test no_std core library
      - name: Build browser library surface (no_std core)
        run: cargo build --locked --lib --no-default-features --target wasm32-unknown-unknown

      # WASI target (wasm32-wasip1): test no_std core library and std library + example
      # Note: async runtimes (tokio, async-std) don't yet support wasm32-wasip1
      - name: Build WASI library surface (no_std core)
        run: cargo build --locked --lib --no-default-features --target wasm32-wasip1

      - name: Build WASI library surface (std, no async)
        run: cargo build --locked --lib --features std --target wasm32-wasip1

      - name: Build WASI smoke example (std)
        run: cargo build --locked --example wasm_runtime_smoke --features std --target wasm32-wasip1

      - name: Install pinned Wasmtime
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/bytecodealliance/wasmtime/releases/download/${WASMTIME_VERSION}/wasmtime-${WASMTIME_VERSION}-x86_64-linux.tar.xz"
          curl --fail --location --retry 3 "$url" -o /tmp/wasmtime.tar.xz
          mkdir -p "$RUNNER_TEMP/wasmtime"
          tar -xJf /tmp/wasmtime.tar.xz -C "$RUNNER_TEMP/wasmtime" --strip-components=1
          echo "$RUNNER_TEMP/wasmtime" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/wasmtime/wasmtime" --version

      - name: Run WASI runtime smoke test (std)
        run: |
          "$RUNNER_TEMP/wasmtime/wasmtime" run --dir=/tmp \
            target/wasm32-wasip1/debug/examples/wasm_runtime_smoke.wasm

  msrv:
    name: MSRV Rust 1.74
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Install MSRV toolchain
        uses: dtolnay/rust-toolchain@1.74.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      
      - name: Check formatting
        run: cargo fmt --all -- --check

      # MSRV job uses `msrv` feature (std without ureq/reqwest) to avoid
      # idna_adapter requiring Rust 2024 edition.
      # Must use --no-default-features to disable default "std" feature.
      - name: Clippy at MSRV
        run: cargo clippy --locked --all-targets --no-default-features --features msrv -- -D warnings

      - name: Run tests at MSRV
        run: cargo test --locked --all-targets --no-default-features --features msrv --verbose

  l2-benchmark:
    name: L2 Baseline Regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # Nonstationary scenario with reduced runs for CI speed (full runs locally).
      # Output JSON artifact for trend tracking / manual regression analysis.
      - name: Run L2 benchmark (nonstationary, 5 seeds)
        run: |
          cargo run --locked --release --bin omega-kernel -- benchmark-l2 \
            --scenario nonstationary --runs 5 --episodes 8 --steps 8 --seed 20261115 --json \
            | tee l2-benchmark.json

      - name: Upload L2 benchmark artifact
        uses: actions/upload-artifact@v7
        with:
          name: l2-benchmark
          path: l2-benchmark.json
          retention-days: 30
