name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --locked --verbose

      - name: Build release binary
        run: cargo build --locked --release --bin omega-kernel

  msrv:
    name: MSRV Rust 1.74
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MSRV toolchain
        uses: dtolnay/rust-toolchain@1.74.0
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      # Keep the MSRV job on the host-independent default feature set. GUI
      # backends are optional and are validated by the stable job above.
      - name: Clippy at MSRV
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run tests at MSRV
        run: cargo test --locked --all-targets --verbose
