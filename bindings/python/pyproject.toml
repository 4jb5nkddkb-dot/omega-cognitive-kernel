[project]
name = "omega-cognitive-kernel"
dynamic = ["version"]
description = "Python bindings for omega-cognitive-kernel: Online strategy-patch runtime with audit and rollback"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Omega Core Contributors"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
keywords = ["cognitive", "agent", "runtime", "patch", "adaptive", "ai"]

[project.urls]
Homepage = "https://github.com/4jb5nkddkb-dot/omega-cognitive-kernel"
Repository = "https://github.com/4jb5nkddkb-dot/omega-cognitive-kernel"
Changelog = "https://github.com/4jb5nkddkb-dot/omega-cognitive-kernel/blob/main/CHANGELOG.md"
Issues = "https://github.com/4jb5nkddkb-dot/omega-cognitive-kernel/issues"
[tool.maturin]
features = ["pyo3/extension-module"]
compatibility = "manylinux2014"
skip-audit = true

[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"
