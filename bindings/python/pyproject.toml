[project]
name = "omega-cognitive-kernel"
version = "0.5.7"
description = "Python bindings for omega-cognitive-kernel: Online strategy-patch runtime with audit and rollback"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Omega Core Contributors"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.8"
keywords = ["cognitive", "agent", "runtime", "patch", "adaptive", "ai"]

[tool.maturin]
features = ["pyo3/extension-module"]
compatibility = "linux"
skip-audit = true

[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"