
[package]
name = "omega-cognitive-kernel-python"
version = "0.8.0"
edition = "2021"
rust-version = "1.83"
description = "Python bindings for omega-cognitive-kernel"
license = "MIT"
repository = "https://github.com/4jb5nkddkb-dot/omega-cognitive-kernel"
categories = ["development-tools::ffi", "external-ffi-bindings"]

[lib]
name = "omega_cognitive_kernel_python"
crate-type = ["cdylib"]

[dependencies]
# The Python API exposes the simulated adapters only; avoid the core's default
# ureq feature, which pulls in an edition-2024 dependency requiring Rust 1.85.
# Keep the binding lockfile's indexmap at 2.13.1: 2.14.2 uses edition 2024
# and exceeds this package's declared Rust 1.83 minimum.
omega-cognitive-kernel = { path = "../../", default-features = false, features = ["std", "toml"] }
pyo3 = { version = "0.29.3", features = ["extension-module"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
uuid = { version = "1", features = ["serde", "v4"] }
chrono = { version = "0.4", features = ["serde"] }
