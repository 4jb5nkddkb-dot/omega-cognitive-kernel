[package]
name = "omega-cognitive-kernel-python"
version = "0.5.19"
edition = "2021"
description = "Python bindings for omega-cognitive-kernel"
license = "MIT"
repository = "https://github.com/4jb5nkddkb-dot/omega-cognitive-kernel"
categories = ["development-tools::ffi", "external-ffi-bindings"]

[lib]
name = "omega_cognitive_kernel_python"
crate-type = ["cdylib"]

[dependencies]
omega-cognitive-kernel = { path = "../../", features = ["std"] }
pyo3 = { version = "0.23", features = ["extension-module"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
uuid = { version = "1", features = ["serde", "v4"] }
chrono = { version = "0.4", features = ["serde"] }

[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"