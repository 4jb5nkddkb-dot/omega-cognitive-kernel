[package]
name = "omega-cognitive-kernel"
version = "0.4.1"
edition = "2021"
rust-version = "1.74"
description = "Online strategy-patch runtime: training-free RuleEffect adaptation with audit and rollback"
license = "MIT"
authors = ["Omega Core Contributors"]
readme = "README.md"
repository = "https://github.com/4jb5nkddkb-dot/omega-cognitive-kernel"
homepage = "https://github.com/4jb5nkddkb-dot/omega-cognitive-kernel"
documentation = "https://github.com/4jb5nkddkb-dot/omega-cognitive-kernel#readme"
keywords = ["cognitive", "agent", "runtime", "patch", "adaptive"]
categories = ["algorithms", "command-line-utilities"]
include = [
  "src/**/*",
  "Cargo.toml",
  "README.md",
  "LICENSE",
  "CHANGELOG.md",
  "ARCHITECTURE.md",
  "docs/**/*",
]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
clap = { version = "4", features = ["derive"] }
toml = "0.8"
ureq = { version = "2", default-features = true }

[[bin]]
name = "omega-kernel"
path = "src/main.rs"
