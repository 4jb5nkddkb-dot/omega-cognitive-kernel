[package]
name = "omega-cognitive-kernel"
version = "0.6.0"
edition = "2021"
rust-version = "1.74"
default-run = "omega-kernel"
description = "Online strategy-patch runtime: training-free RuleEffect adaptation with audit and rollback"
license = "MIT"
authors = ["Omega Core Contributors"]
readme = "README.md"
repository = "https://github.com/4jb5nkddkb-dot/omega-cognitive-kernel"
homepage = "https://github.com/4jb5nkddkb-dot/omega-cognitive-kernel"
documentation = "https://github.com/4jb5nkddkb-dot/omega-cognitive-kernel#readme"
keywords = ["cognitive", "agent", "runtime", "patch", "adaptive"]
categories = ["algorithms", "command-line-utilities"]
include = [
  "src/**/*",
  "examples/**/*",
  "Cargo.toml",
  "README.md",
  "LICENSE",
  "NOTICE",
  "CHANGELOG.md",
  "ARCHITECTURE.md",
  "docs/**/*",
]

[features]
default = ["std", "ureq", "toml"]
# std feature: enables std support + core deps (serde, chrono, etc.).
# Does NOT include toml (which pulls indexmap 2.x / Rust 2024).
std = [
  "serde/std",
  "serde_json/std",
  "chrono/std",
  "chrono/clock",
  "uuid/std",
  "anyhow/std",
  "tracing/std",
  "dep:clap",
  "dep:tracing-subscriber",
  "dep:chacha20poly1305",
  "dep:getrandom",
]
# Optional toml support (requires indexmap 2.x / Rust 2024).
toml = ["dep:toml"]
# Network deps (ureq/reqwest) pulled out of std for MSRV compatibility.
# ureq/reqwest pull in idna_adapter requiring Rust 2024 edition.
ureq = ["dep:ureq", "dep:url"]
reqwest = ["dep:reqwest", "dep:url"]
gui = ["dep:eframe", "dep:egui", "dep:rfd", "toml"]
async = ["dep:tokio", "dep:async-std", "dep:futures", "reqwest"]
# Enable wasm32-unknown-unknown support (requires getrandom with js feature)
wasm = ["getrandom/js"]
# docs.rs feature to enable #[cfg_attr(docsrs, doc(cfg(...)))] rendering
docsrs = []

# MSRV-compatible subset: std without network deps (ureq/reqwest pull in
# idna_adapter requiring Rust 2024 edition, incompatible with Rust 1.74).
# Also excludes toml (toml_edit requires indexmap 2.x / Rust 2024).
msrv = ["std"]

[dependencies]
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
uuid = { version = "=1.8", default-features = false, features = ["serde"] }
chrono = { version = "0.4", default-features = false, features = ["serde", "alloc"] }
anyhow = { version = "1", default-features = false }
tracing = { version = "0.1", default-features = false }
hashbrown = { version = "0.14", default-features = false, features = ["serde", "ahash"] }
libm = "0.2"
# indexmap 2.x requires Rust 2024 edition; pin to 1.x for MSRV 1.74 compatibility.
indexmap = "=1.9.3"
# toml 0.8 uses toml_edit 0.22 which requires indexmap 2.x (Rust 2024).
# Pin to 0.7.x which uses toml_edit 0.19 (compatible with indexmap 1.x / Rust 2021).
toml = { version = "0.7", optional = true }
clap = { version = "=4.5.43", optional = true, features = ["derive"] }
tracing-subscriber = { version = "0.3", optional = true }
ureq = { version = "2.12", default-features = true, optional = true }

tokio = { version = "1", optional = true, features = ["fs", "io-util", "time", "rt-multi-thread", "macros"] }
async-std = { version = "1", optional = true, features = ["attributes"] }
futures = { version = "0.3", optional = true }
reqwest = { version = "0.12", optional = true, features = ["json", "rustls-tls", "stream"] }
chacha20poly1305 = { version = "=0.10.1", default-features = false, features = ["alloc"], optional = true }
url = { version = "2.5", optional = true }
getrandom = { version = "0.2", optional = true }

eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"], optional = true }
egui = { version = "0.29", optional = true }
# rfd's build script hard-fails on Linux/BSD unless exactly one backend is
# selected, and `xdg-portal` requires an async runtime feature. Keep
# `default-features = false` (to stay off gtk3 and its system libs) but pick the
# pure-Rust portal backend explicitly with tokio (no libgtk-3-dev needed in CI).
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"], optional = true }

[[bin]]
name = "omega-kernel"
path = "src/main.rs"

[[bin]]
name = "omega-audit-panel"
path = "src/bin/omega_audit_panel.rs"

[[bin]]
name = "omega-dashboard"
path = "src/bin/omega_dashboard.rs"
required-features = ["gui"]

[[example]]
name = "config_and_dir"
required-features = ["toml"]

[[example]]
name = "drop_inbox_loop"
required-features = ["toml"]

[[example]]
name = "inbox_vertical"
required-features = ["toml"]

[[example]]
name = "tool_gate"
required-features = ["ureq"]

[[example]]
name = "tool_gate_http"
required-features = ["ureq"]
[[example]]
name = "wasm_runtime_smoke"
required-features = ["std"]
