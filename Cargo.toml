[package]
name = "omega-cognitive-kernel"
version = "0.1.0"
edition = "2021"
description = "Omega Cognitive Kernel — L0/L1/L2 metacognitive architecture with omega=dayan fixed point"
license = "MIT"
authors = ["Omega Core Contributors"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"

[[bin]]
name = "omega-kernel"
path = "src/main.rs"
